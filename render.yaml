services:
  - type: web
    name: sap-odata-mock
    env: docker
    plan: free
    autoDeploy: true
    envVars:
      - key: MOCK_REQUIRE_AUTH
        value: "true"
      - key: MOCK_USER
        value: "demo"
      - key: MOCK_PASS
        value: "demo123"
      - key: MOCK_SOURCE_FILE
        value: "/app/sap-response.actual.json"
      - key: MOCK_REPLICATE_FACTOR
        value: "1"
      - key: MOCK_LIMIT_ROWS
        value: "0"
